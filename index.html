<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <title>MERT'S EDITING | @M3RTavar Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg-color: #090713;
      --card-bg: #110d26;
      --card-border: #231b42;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* --- NAVIGATION --- */
    nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1000px;
      background: rgba(17, 13, 38, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 99px;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .social-links {
      display: flex;
      gap: 12px;
    }

    .social-links a {
      color: var(--text-muted);
      transition: color 0.3s;
    }

    .social-links a:hover {
      color: var(--text-main);
    }

    .nav-menu {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-menu a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-menu a:hover {
      color: var(--text-main);
    }

    /* --- LAYOUT WRAPPER --- */

      max-width: 1000px;
      margin: 0 auto;
      padding: 140px 20px 80px 20px;
    }
